services:
  server:
    image: nginx:alpine
    container_name: server_bai14
    restart: unless-stopped
    networks:
      - private-network

  client:
    image: alpine:latest
    container_name: client_bai14
    restart: unless-stopped
    command: sh -c "apk add --no-cache wget && sleep infinity"
    depends_on:
      - server
    networks:
      - private-network

networks:
  private-network:
    driver: bridge
