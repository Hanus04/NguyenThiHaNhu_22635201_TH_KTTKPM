spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/movie_service
    username: root
    password: sapassword
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      data-source-properties:
        useGssapi: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  jackson:
    default-property-inclusion: non_null

app:
  seed-data: true

logging:
  level:
    org.springframework.jdbc: DEBUG
    org.hibernate: DEBUG
    org.mariadb.jdbc: DEBUG